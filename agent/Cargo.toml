[package]
name = "passbundle-agent"
version = "0.1.0"
description = "The PassBundle desktop agent: a tray app with no windows"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"
publish = false

# Its own workspace: upstream's desktop_native crates link Bitwarden SDK crates
# that aren't under a standard open-source license, so the agent never builds
# with them. See README.md.
[workspace]

[lib]
name = "passbundle_agent"
path = "src/lib.rs"

# The tray app, one per signed-in user.
[[bin]]
name = "passbundle-agent"
path = "src/main.rs"

# What browsers start for native messaging: a pipe to the agent. A console
# program, since Windows doesn't give a GUI program's stdin and stdout to the
# browser reliably.
[[bin]]
name = "passbundle-agent-host"
path = "src/host.rs"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
rsa = { version = "0.9", default-features = false, features = ["std"] }
sha1 = "0.10"
zeroize = { version = "1", features = ["derive"] }
minisign-verify = "0.3"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The OS's own TLS (SChannel, Security.framework) and certificate store: no C
# crypto to build, and it trusts what the machine trusts, such as an office
# firewall's root. Releases are checked by signature either way.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
# Windows Hello's key credentials and consent prompts (WinRT).
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Credentials_UI",
  "Security_Cryptography",
  "Storage_Streams",
] }
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

# Who's at the other end of the agent's socket (ipc::peer_program).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# A stand-in for Windows Hello, for end-to-end tests. Debug builds only:
# release builds refuse to compile with it.
test-authenticator = []

[build-dependencies]
serde_json = "1"

[dev-dependencies]
minisign = "0.10"
tiny_http = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
