[package]
name = "passbundle-ipc"
version = "0.1.0"
description = "The desktop agent's local socket, shared by the agent, its native-messaging host, and the app's core"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"
publish = false

# Its own workspace, for its own tests; the agent and the core use it by path.
[workspace]

[features]
# PASSBUNDLE_AGENT_TEST_HOME gives tests a private address. Test builds only.
test-home = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
