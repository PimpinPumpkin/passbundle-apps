# Linux test releases (README, "Windows and Linux test releases"): every
# commit on main that passes CI, built again from that commit for 64-bit
# Intel and AMD (x64) and for 64-bit ARM (arm64), and published as a GitHub
# release, which the app's updater reads (core/src/updates).
#
# What's signed is the release's manifest (its tag, version, and each
# file's name, platform, size, and SHA-256), with PassBundle's Ed25519 test
# release key, whose public half the app has (core/src/updates/mod.rs,
# PINNED_KEYS). Four jobs, as the Android, Mac, and Windows releases'
# (release.yml, macos-release.yml, windows-release.yml), so the key and the
# token that can publish never meet the build's own code (Rust crates' build
# scripts and macros, CMake, Flutter):
#
#   plan     the version, whether there's anything new, and the notes (git only)
#   build    the app and the core and its updater, without test hooks, packed
#            as the release's tarball, one per chip type; no secrets, read-only
#   sign     the only job with the key: checks the tarballs, then writes and
#            signs their manifest with jq, OpenSSL, and this file's own shell,
#            running nothing from the repository; read-only
#   publish  the only job that can write: gh release create; no secrets
#
# Tagged linux-v<major>.<minor>.<build>: the major and minor are
# pubspec.yaml's, and the build is this workflow's run number, which only
# goes up. Renaming this file starts the run number at 1 again: add an
# offset to BUILD then, or the versions go backwards.
#
# A Linux release is never marked as the latest release: releases/latest
# stays Android's. The app reads the list of releases and takes the newest
# linux-v one. Without the key's secret (a fork), sign stops after saying
# so, and nothing is published.
name: Linux release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: linux-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6
  FLUTTER_COMMIT: 5fc346839b5d0eef006ed8404392afb4dfae428d
  # The release key's public half (the PASSBUNDLE_DESKTOP_UPDATE_KEY secret's),
  # as the app pins it: a release is published only signed with it.
  UPDATE_PUBLIC_KEY: 5db5f4827dab67b3d7ef0726a202921728e5159ee70199d6e4ea059a1e72b0c5

jobs:
  plan:
    name: What to release
    # Only main's own pushes that passed CI (not a fork's branch that's also
    # called main), or a run started by hand on main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed, not main's head now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The tags, for the last release and the notes.
          fetch-depth: 0
          persist-credentials: false
      - name: The version, and whether there's anything new
        id: plan
        env:
          BUILD: ${{ github.run_number }}
        run: |
          sha=$(git rev-parse HEAD)
          base=$(sed -n 's/^version: \([0-9]*\.[0-9]*\)\..*/\1/p' app/pubspec.yaml)
          [ -n "$base" ] || { echo "No version in app/pubspec.yaml." >&2; exit 1; }
          version="$base.$BUILD"
          # The newest Linux release, by build number.
          last=$(git tag -l 'linux-v*' | awk -F. '{ print $NF "\t" $0 }' | sort -n | tail -1 | cut -f2)
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "build=$BUILD"
            echo "last=$last"
          } >> "$GITHUB_OUTPUT"
          # A commit already released, or older than the last release (CI
          # runs can finish out of order), isn't released again.
          if [ -n "$last" ] && git merge-base --is-ancestor "$sha" "$last"; then
            echo "${sha:0:9} is already in $last: nothing new to release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing ${sha:0:9} as $version (the last release is ${last:-none})." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The notes, the commit subjects since the last release
        id: notes
        if: steps.plan.outputs.release == 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          VERSION: ${{ steps.plan.outputs.version }}
          LAST: ${{ steps.plan.outputs.last }}
        run: |
          if [ -n "$LAST" ]; then
            since="since ${LAST#linux-v}"
            changes=$(git log --no-merges --format='- %s' "$LAST..$SHA")
          else
            since="in this first test release"
            changes=$(git log --no-merges --format='- %s' -n 20 "$SHA")
          fi
          notes=$(
            echo "What's new $since:"
            echo
            echo "${changes:-- Maintenance}"
            echo
            echo "Files: PassBundle-$VERSION-linux-x64.tar.gz is the app for 64-bit Intel and AMD computers, and PassBundle-$VERSION-linux-arm64.tar.gz for 64-bit ARM ones; each needs GTK 3. manifest.json names them, with their sizes and SHA-256, and manifest.json.sig is the manifest's signature. SHA256SUMS lists their SHA-256."
            echo
            echo "A test build: its manifest is signed with PassBundle's Ed25519 test release key (public key ${UPDATE_PUBLIC_KEY}). Unpack it into a folder of your own, such as ~/.local/opt (mkdir -p ~/.local/opt && tar -xzf PassBundle-$VERSION-linux-x64.tar.gz -C ~/.local/opt), and open ~/.local/opt/PassBundle/passbundle. After that, PassBundle updates itself from these releases (Settings, Updates). Installed where only root can change it (/opt, say), it only says when there's a new version."
          )
          echo "$notes"
          end="NOTES_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
          printf 'notes<<%s\n%s\n%s\n' "$end" "$notes" "$end" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.plan.outputs.version }} (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            arch: x64
            chip: x86-64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            chip: ARM aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # No secrets here, and nothing it can write: this is where the build's
    # own code runs.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # As CI's App (linux) job builds it (ci.yml), without its cache or its
      # test hooks: a release is built from scratch.
      - name: Linux build tools, and the OS secret store's and TLS headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libdbus-1-dev libssl-dev
      - name: Install the pinned Rust toolchain
        working-directory: core
        run: rustup toolchain install
      - name: Build the core and its updater
        working-directory: core
        run: cargo build --locked --release --features ffi
      - name: Install Flutter at the pinned release
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Turn off analytics
        run: |
          flutter config --no-analytics
          flutter --disable-analytics
      - name: The Dart packages pubspec.lock pins, and no others
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Build the app, with this version
        working-directory: app
        run: flutter build linux --release --build-name "$VERSION" --build-number "$BUILD"
      - name: Put the core and the updater in it, check it, and pack it
        env:
          ARCH: ${{ matrix.arch }}
          CHIP: ${{ matrix.chip }}
        run: |
          tools/release-folder.sh "app/build/linux/$ARCH/release/bundle" core/target/release - stage "$VERSION" "$PLATFORM"
          dir=stage/PassBundle
          # A release reads no test settings from its environment (the
          # core's test-hooks feature, which only CI's builds have).
          if grep -a -q -E 'PB_DATA_DIR|PB_SECRETS|PB_UPDATE_SOURCE|PB_UPDATE_KEY' "$dir/lib/libpassbundle_core.so"; then
            echo "The core was built with its test hooks." >&2
            exit 1
          fi
          # Its version, and every program and library in it, for this chip.
          test "$(jq -r .version "$dir/data/flutter_assets/version.json")" = "$VERSION"
          find "$dir" -type f -print0 | while IFS= read -r -d '' f; do
            kind=$(file -b "$f")
            [[ "$kind" == ELF* ]] || continue
            if [[ "$kind" != *"$CHIP"* ]]; then
              echo "$f isn't for $CHIP: $kind" >&2
              exit 1
            fi
          done
          "$dir/passbundle-update" --version
          # Plain files and folders only.
          if find "$dir" ! -type f ! -type d | grep .; then
            echo "The release has something that isn't a file or a folder." >&2
            exit 1
          fi
          mkdir dist
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -czf "dist/PassBundle-$VERSION-$PLATFORM.tar.gz" -C stage PassBundle
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passbundle-${{ matrix.platform }}-${{ needs.plan.outputs.version }}-unsigned
          path: dist
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign ${{ needs.plan.outputs.version }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Once the user makes a "desktop-release" environment (Settings,
    # Environments), with the PASSBUNDLE_DESKTOP_UPDATE_KEY secret in it and
    # whatever rules they want, this job, and only this one, takes it:
    # environment: desktop-release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    # No checkout: nothing from the repository runs here, only the runner's
    # own tools (unzip, jq, OpenSSL) and this file's own shell.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passbundle-linux-*-${{ needs.plan.outputs.version }}-unsigned
          path: unsigned
          merge-multiple: true
      - name: The release key, from the repository's secrets
        id: key
        env:
          UPDATE_KEY: ${{ secrets.PASSBUNDLE_DESKTOP_UPDATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::notice::No release key in this repository's secrets: the tarballs stay unsigned (the build's artifacts), and nothing is published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/update-key.pem"
          # The key the app trusts, and no other.
          public=$(openssl pkey -in "$RUNNER_TEMP/update-key.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          if [ "$public" != "$UPDATE_PUBLIC_KEY" ]; then
            echo "The secret isn't the release key the app pins ($public)." >&2
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Write the manifest, sign it, and check it
        if: steps.key.outputs.signed == 'true'
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          mkdir dist
          files='[]'
          for platform in linux-x64 linux-arm64; do
            tarball="PassBundle-$VERSION-$platform.tar.gz"
            # One PassBundle folder of plain files and folders, this release
            # at this version, for this platform.
            if tar -tzf "unsigned/$tarball" | grep -v '^PassBundle/'; then
              echo "$tarball holds something outside its PassBundle folder." >&2
              exit 1
            fi
            if tar -tvzf "unsigned/$tarball" | grep -v -E '^[-d]'; then
              echo "$tarball holds something that isn't a file or a folder." >&2
              exit 1
            fi
            release=$(tar -xzOf "unsigned/$tarball" PassBundle/release.json)
            test "$(jq -r .version <<< "$release")" = "$VERSION"
            test "$(jq -r .platform <<< "$release")" = "$platform"
            test "$(jq -r .app <<< "$release")" = com.passbundle.app
            cp "unsigned/$tarball" dist/
            files=$(jq -c --arg name "$tarball" --arg platform "$platform" \
              --argjson size "$(stat -c %s "dist/$tarball")" --arg sha "$(sha256sum "dist/$tarball" | cut -d' ' -f1)" \
              '. + [{name: $name, platform: $platform, size: $size, sha256: $sha}]' <<< "$files")
          done
          # The manifest (DESIGN.md in the meta repo, "Desktop updates"; the
          # same as tools/desktop-update-test.sh's, which CI runs on every
          # commit with a throwaway key).
          jq -n -c --arg tag "linux-v$VERSION" --arg version "$VERSION" --arg commit "$SHA" --arg notes "$NOTES" \
            --argjson files "$files" \
            '{format: 1, app: "com.passbundle.app", tag: $tag, version: $version, commit: $commit, notes: $notes,
              files: $files}' > dist/manifest.json
          cat dist/manifest.json
          { printf 'PassBundle desktop release v1\n'; cat dist/manifest.json; } > "$RUNNER_TEMP/signed"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update-key.pem" -rawin -in "$RUNNER_TEMP/signed" -out "$RUNNER_TEMP/signature"
          openssl base64 -A -in "$RUNNER_TEMP/signature" > dist/manifest.json.sig
          # Checked as the app checks it: with the pinned public key alone.
          printf "$(printf '302a300506032b6570032100%s' "$UPDATE_PUBLIC_KEY" | sed 's/../\\x&/g')" > "$RUNNER_TEMP/public.der"
          openssl base64 -d -A -in dist/manifest.json.sig > "$RUNNER_TEMP/check"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/public.der" -rawin \
            -in "$RUNNER_TEMP/signed" -sigfile "$RUNNER_TEMP/check"
          (cd dist && sha256sum PassBundle-*.tar.gz manifest.json manifest.json.sig > SHA256SUMS && cat SHA256SUMS)
          ls -l dist
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-key.pem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: passbundle-linux-${{ needs.plan.outputs.version }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.plan.outputs.version }}
    needs: [plan, sign]
    if: needs.sign.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write, with no secrets but its token, and no
    # code from the repository.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: passbundle-linux-${{ needs.plan.outputs.version }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          # Not the latest: releases/latest stays Android's (see the top).
          gh release create "linux-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "PassBundle $VERSION for Linux" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false \
            dist/PassBundle-"$VERSION"-linux-*.tar.gz dist/manifest.json dist/manifest.json.sig dist/SHA256SUMS
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/linux-v$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
