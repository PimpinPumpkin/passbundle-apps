# Android test releases (README, "Android test releases"): every commit on
# main that passes CI, built again from that commit, signed with PassBundle's
# test key, and published as a GitHub release, which the app's updater reads
# (app/android/app/src/main/kotlin/com/passbundle/app/update/Updater.kt).
#
# Four jobs, so the key and the token that can publish never meet the build's
# own code (Rust crates' build scripts and macros, Gradle, the Android Gradle
# plugin, Flutter):
#
#   plan     the version, whether there's anything new, and the notes (git only)
#   build    the APKs, signed with the runner's debug key; no secrets, read-only
#   sign     the only job with the key: re-signs the build's APKs with the
#            SDK's apksigner and this file's own shell, running nothing from
#            the repository, and checks them; read-only
#   publish  the only job that can write: gh release create; no secrets
#
# Tagged android-v<major>.<minor>.<build>: the major and minor are
# pubspec.yaml's, and the build is this workflow's run number, which only
# goes up, so each release's versionCode is higher than the last (Flutter
# adds 2000 to it for arm64-v8a and 4000 for x86_64). Renaming this file
# starts the run number at 1 again: add an offset to BUILD then, or the
# versions go backwards.
#
# The release is a full one (not a prerelease), so releases/latest is the
# newest. Without the key's secrets (a fork), sign stops after saying so, and
# the debug-signed APKs stay as the build's artifact, never published.
name: Android release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6
  FLUTTER_COMMIT: 5fc346839b5d0eef006ed8404392afb4dfae428d
  # The test key's certificate (the PASSBUNDLE_TEST_KEYSTORE_* secrets): a
  # release is published only signed with it.
  TEST_CERT_SHA256: c995faf233199dec1b7453a52cf405d1657323d9b4bf98efcb52a718a71d9e3a

jobs:
  plan:
    name: What to release
    # Only main's own pushes that passed CI (not a fork's branch that's also
    # called main), or a run started by hand on main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed, not main's head now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The tags, for the last release and the notes.
          fetch-depth: 0
          persist-credentials: false
      - name: The version, and whether there's anything new
        id: plan
        env:
          BUILD: ${{ github.run_number }}
        run: |
          sha=$(git rev-parse HEAD)
          base=$(sed -n 's/^version: \([0-9]*\.[0-9]*\)\..*/\1/p' app/pubspec.yaml)
          [ -n "$base" ] || { echo "No version in app/pubspec.yaml." >&2; exit 1; }
          version="$base.$BUILD"
          # The newest Android release, by build number.
          last=$(git tag -l 'android-v*' | awk -F. '{ print $NF "\t" $0 }' | sort -n | tail -1 | cut -f2)
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "build=$BUILD"
            echo "last=$last"
          } >> "$GITHUB_OUTPUT"
          # A commit already released, or older than the last release (CI
          # runs can finish out of order), isn't released again.
          if [ -n "$last" ] && git merge-base --is-ancestor "$sha" "$last"; then
            echo "${sha:0:9} is already in $last: nothing new to release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing ${sha:0:9} as $version (the last release is ${last:-none})." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The notes, the commit subjects since the last release
        id: notes
        if: steps.plan.outputs.release == 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          VERSION: ${{ steps.plan.outputs.version }}
          LAST: ${{ steps.plan.outputs.last }}
        run: |
          if [ -n "$LAST" ]; then
            since="since ${LAST#android-v}"
            changes=$(git log --no-merges --format='- %s' "$LAST..$SHA")
          else
            since="in this first test release"
            changes=$(git log --no-merges --format='- %s' -n 20 "$SHA")
          fi
          notes=$(
            echo "What's new $since:"
            echo
            echo "${changes:-- Maintenance}"
            echo
            echo "Files: passbundle-$VERSION-arm64-v8a.apk is for phones, and passbundle-$VERSION-x86_64.apk for the emulator and Chromebooks. SHA256SUMS lists their SHA-256."
            echo
            echo "A test build, signed with PassBundle's test key (certificate SHA-256 ${TEST_CERT_SHA256}). PassBundle updates itself from these releases (Settings, Updates). A copy signed with another key, such as one you built, has to be uninstalled before installing this one."
          )
          echo "$notes"
          end="NOTES_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
          printf 'notes<<%s\n%s\n%s\n' "$end" "$notes" "$end" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No secrets here, and nothing it can write: this is where the build's
    # own code runs.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # As CI's Android job builds them (ci.yml), without its cache: a
      # release is built from scratch.
      - name: Install the pinned Rust toolchain, with Android's targets
        run: cd core && rustup toolchain install && rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build the core for phones and the emulator
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/android-core.sh build arm64-v8a x86_64
      - name: Install Flutter at the pinned release
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Turn off analytics
        run: |
          flutter config --no-analytics
          flutter --disable-analytics
      - name: The Dart packages pubspec.lock pins, and no others
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Build the release APKs, one per chip type, with the debug key
        working-directory: app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --build-name "$VERSION" --build-number "$BUILD"
      - name: Each keeps what the core calls through JNI, and has this version
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          mkdir dist
          for abi in arm64-v8a x86_64; do
            apk="app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            tools/android-release-check.sh "$apk"
            badging=$("$aapt2" dump badging "$apk")
            grep -q "^package: name='com.passbundle.app' .*versionName='$VERSION'" <<< "$badging"
            cp "$apk" "dist/passbundle-$VERSION-$abi.apk"
          done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passbundle-android-${{ needs.plan.outputs.version }}-debug-key
          path: dist
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign ${{ needs.plan.outputs.version }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Once the user makes an "android-release" environment (Settings,
    # Environments), with the PASSBUNDLE_TEST_* secrets in it and whatever
    # rules they want, this job, and only this one, takes it:
    # environment: android-release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    # No checkout: nothing from the repository runs here, only the SDK's
    # build tools (apksigner, zipalign) and this file's own shell.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: passbundle-android-${{ needs.plan.outputs.version }}-debug-key
          path: unsigned
      - name: The test key, from the repository's secrets
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.PASSBUNDLE_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No test key in this repository's secrets: the APKs stay signed with the debug key (the build's artifact), and nothing is published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/passbundle-test.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Sign each with the test key, and check it
        if: steps.key.outputs.signed == 'true'
        env:
          PASSBUNDLE_KEYSTORE_PASSWORD: ${{ secrets.PASSBUNDLE_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PASSBUNDLE_TEST_KEY_ALIAS }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          mkdir dist
          for abi in arm64-v8a x86_64; do
            name="passbundle-$VERSION-$abi.apk"
            # apksigner replaces the debug signature, keeping the build's
            # alignment (native libraries on 16 KB pages). No JAR signature
            # (Android 10 and later never read it) and no .idsig file.
            "$tools/apksigner" sign \
              --ks "$RUNNER_TEMP/passbundle-test.p12" --ks-type PKCS12 \
              --ks-pass env:PASSBUNDLE_KEYSTORE_PASSWORD --key-pass env:PASSBUNDLE_KEYSTORE_PASSWORD \
              --ks-key-alias "${KEY_ALIAS:-passbundle-test}" \
              --min-sdk-version 29 \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
              --out "dist/$name" "unsigned/$name"
            "$tools/zipalign" -c -P 16 4 "dist/$name"
            certs=$("$tools/apksigner" verify --min-sdk-version 29 --print-certs "dist/$name")
            # Every certificate line, whichever way this apksigner labels the
            # signer ("Signer #1" or "V3.0 Signer"), must name the test key.
            digests=$({ grep -oE 'certificate SHA-256 digest: [0-9a-f]+' <<< "$certs" || true; } | awk '{print $NF}' | sort -u)
            if [ "$digests" != "$TEST_CERT_SHA256" ]; then
              echo "$certs"
              echo "$name isn't signed with the test key alone." >&2
              exit 1
            fi
          done
          (cd dist && sha256sum passbundle-*.apk > SHA256SUMS && cat SHA256SUMS)
          ls -l dist
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/passbundle-test.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: passbundle-android-${{ needs.plan.outputs.version }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.plan.outputs.version }}
    needs: [plan, sign]
    if: needs.sign.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write, with no secrets but its token, and no
    # code from the repository.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: passbundle-android-${{ needs.plan.outputs.version }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "android-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "PassBundle $VERSION for Android" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest \
            dist/passbundle-*.apk dist/SHA256SUMS
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/android-v$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
