# Every commit: the core's checks, then the app built, tested against the
# real core, measured, and screenshotted on Linux, macOS, and Windows. The
# numbers land in each run's summary; the builds and screenshots are its
# artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6
  FLUTTER_COMMIT: 5fc346839b5d0eef006ed8404392afb4dfae428d

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The OS secret store's and TLS headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev pkg-config
      - name: Install the pinned Rust toolchains
        run: |
          rustup toolchain install
          (cd ../agent && rustup toolchain install)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            core
            agent
      - name: The agent's test build, for the core's agent tests
        working-directory: agent
        run: cargo build --locked --features test-authenticator
      - name: No Bitwarden crates
        run: ../tools/check-no-bitwarden-crates.sh
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features ffi -- -D warnings
      - name: Tests (the vectors, a real agent, and the real clipboard where there's a desktop)
        env:
          PB_TEST_CLIPBOARD: ${{ runner.os != 'Linux' && '1' || '' }}
        run: |
          [ -n "$PB_TEST_CLIPBOARD" ] || unset PB_TEST_CLIPBOARD
          export PB_TEST_AGENT="$GITHUB_WORKSPACE/agent/target/debug/passbundle-agent$( [ "$RUNNER_OS" = Windows ] && echo .exe)"
          cargo test --locked

  android:
    # The core and the app on Android (docs/phones.md): the core built for
    # phones and the emulator with the NDK, its lints for Android, its tests,
    # and the app's own tests, on an Android 10 emulator (the oldest version
    # the apps support), signing in to a real server through adb.
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-server
          ref: keykeeper
          path: server
          persist-credentials: false
      - name: Start an Android 10 emulator, which boots while the rest builds
        run: |
          # adb, for the steps after.
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # The emulator needs KVM, which the runner has but only root may use.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # One place for the emulator's AVD, where avdmanager writes it and the emulator reads it
          # (avdmanager otherwise follows $XDG_CONFIG_HOME, which the runner sets).
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          # Accepting the licenses ends `yes` with a broken pipe, which isn't a failure.
          (yes || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install emulator "system-images;android-29;default;x86_64" > /dev/null
          echo no | "$tools/avdmanager" create avd -n ci -k "system-images;android-29;default;x86_64" --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
      - name: Server build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libssl-dev libdbus-1-dev pkg-config
      - name: Install the pinned Rust toolchains, with Android's targets
        run: |
          (cd core && rustup toolchain install && rustup target add aarch64-linux-android x86_64-linux-android)
          (cd server && rustup toolchain install)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            core
            server
          key: android
      - name: Lints, for Android
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_x86_64_linux_android="$toolchain/x86_64-linux-android29-clang" AR_x86_64_linux_android="$toolchain/llvm-ar"
          cargo clippy --locked --all-targets --features ffi --target x86_64-linux-android -- -D warnings
      - name: Build for phones and the emulator
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/android-core.sh build arm64-v8a x86_64
      - name: Build the server, and start it
        run: |
          (cd server && cargo build --features sqlite)
          echo "PB_TEST_SERVER=$(tools/test-server.sh server/target/debug/vaultwarden 8591 "$RUNNER_TEMP/server")" >> "$GITHUB_ENV"
      - name: Install Flutter at the pinned release
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Turn off analytics
        run: |
          flutter config --no-analytics
          flutter --disable-analytics
      - name: The emulator, booted
        run: |
          booted=""
          for _ in $(seq 150); do
            if [ "$(adb shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; then
              booted=yes
              break
            fi
            sleep 2
          done
          if [ -z "$booted" ]; then
            echo "The emulator didn't boot in 5 minutes:" >&2
            tail -50 "$RUNNER_TEMP/emulator.log" >&2
            exit 1
          fi
          adb shell getprop ro.build.version.release
      - name: The core's tests, on the emulator
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/android-core.sh test x86_64
      - name: The app's tests, on the emulator (unlock, copying through Kotlin, locking, Android's certificate checks, signing in with the Keystore keeping the session, and biometric unlock)
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_SERIAL=emulator-5554 tools/android-app-test.sh
      - name: Filling another app's sign-in form through Android's autofill, and saving a new one
        run: ANDROID_SERIAL=emulator-5554 tools/android-autofill-test.sh
      - name: The emulator's and the server's logs
        if: failure()
        run: |
          tail -50 "$RUNNER_TEMP/emulator.log" || true
          cat "$RUNNER_TEMP/server/server.log" || true
          # Android's own log: autofill, PassBundle, and anything that crashed.
          adb -s emulator-5554 logcat -d -v time | grep -iE 'autofill|passbundle|AndroidRuntime|FATAL' | tail -300 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-android
          path: app/android/app/src/main/jniLibs

  ios:
    # The core on iOS (docs/phones.md, "The core on phones"): its lints for
    # iOS, the static library for iPhones and the simulator that the app links,
    # and its tests run on an iPhone simulator.
    name: iOS
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain, with iOS's targets
        working-directory: core
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          key: ios
      - name: Lints, for iOS
        working-directory: core
        run: IPHONEOS_DEPLOYMENT_TARGET=17.0 cargo clippy --locked --all-targets --features ffi --target aarch64-apple-ios-sim -- -D warnings
      - name: Build for iPhones and the simulator
        run: tools/ios-core.sh build
      - name: The core's tests, on an iPhone simulator
        run: tools/ios-core.sh test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-ios
          path: app/ios/PassBundleCore.xcframework

  agent:
    # The desktop agent (agent/README.md): the tray app, Windows Hello for the
    # browser extension, and the native-messaging host. Moved here from
    # passbundle-clients, with the checks it had in tier 1.
    name: Agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - name: No Bitwarden SDK or desktop_native crates
        # They aren't all under standard open-source licenses (see agent/README.md).
        run: |
          if grep -nE '^name = "(bitwarden|desktop_|biometric|secure_memory)' Cargo.lock; then
            echo "The agent must not depend on these crates." >&2
            exit 1
          fi
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features test-authenticator -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: The shared socket crate (../ipc)
        working-directory: ipc
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features test-home -- -D warnings
          cargo test --locked
      - name: The agent and the native-messaging host as separate processes
        # With the stand-in authenticator, which release builds refuse.
        run: cargo test --locked --features test-authenticator --test host
      - name: Release build
        if: runner.os != 'Linux'
        run: |
          cargo build --locked --release
          if cargo build --locked --release --features test-authenticator 2> refused.txt; then
            echo "A release build included the test authenticator." >&2
            exit 1
          fi
          grep -q "release builds can't include it" refused.txt
      - name: Size, version, and a run in the tray
        if: runner.os != 'Linux'
        run: |
          exe=target/release/passbundle-agent
          host=target/release/passbundle-agent-host
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; host="$host.exe"; fi
          size=$(( $(wc -c < "$exe") + $(wc -c < "$host") ))
          echo "Size: $size bytes (agent and host)"
          # DESIGN.md: under 10 MB.
          test "$size" -lt 10485760
          name=$(node -p 'require("../brand/brand.json").name')
          "$exe" --version | tee version.txt
          grep -qx "$name agent [0-9]*\.[0-9]*\.[0-9]*" version.txt
          # CI builds have no update key, so they never update themselves.
          "$exe" --update | grep -qx "This build doesn't update itself."
          # The tray app starts and stays up; a second one for the same user exits.
          "$exe" &
          pid=$!
          sleep 5
          kill -0 "$pid"
          "$exe"
          kill -0 "$pid"
          kill "$pid"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'Linux'
        with:
          name: agent-${{ matrix.os }}
          path: |
            agent/target/release/passbundle-agent
            agent/target/release/passbundle-agent.exe
            agent/target/release/passbundle-agent-host
            agent/target/release/passbundle-agent-host.exe
          if-no-files-found: error
          retention-days: 3

  core-server:
    # Real keys against a real PassBundle server (core/tests/server.rs):
    # signing up, signing in, two-step login, sync, saving, and organizations.
    name: Core against a real server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PimpinPumpkin/passbundle-server
          ref: keykeeper
          path: server
          persist-credentials: false
      - name: Server build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libssl-dev libdbus-1-dev pkg-config
      - name: Install the pinned Rust toolchains
        run: |
          (cd core && rustup toolchain install)
          (cd server && rustup toolchain install)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            core
            server
      - name: Build the server
        working-directory: server
        run: cargo build --features sqlite
      - name: Start it
        run: echo "PB_TEST_SERVER=$(tools/test-server.sh server/target/debug/vaultwarden 8591 "$RUNNER_TEMP/server")" >> "$GITHUB_ENV"
      - name: The core against it
        working-directory: core
        run: cargo test --locked --test server
      - name: The server's log
        if: failure()
        run: cat "$RUNNER_TEMP/server/server.log" || true

  app:
    name: App (${{ matrix.platform }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            flutter: flutter
            lib: core/target/release/libpassbundle_core.so
            bundle: app/build/linux/x64/release/bundle
            exe: app/build/linux/x64/release/bundle/passbundle
          - platform: macos
            os: macos-15
            flutter: flutter
            lib: core/target/release/libpassbundle_core.dylib
            bundle: app/build/macos/Build/Products/Release/passbundle.app
            exe: app/build/macos/Build/Products/Release/passbundle.app/Contents/MacOS/passbundle
          - platform: windows
            os: windows-2025
            flutter: flutter.bat
            lib: core/target/release/passbundle_core.dll
            bundle: app/build/windows/x64/runner/Release
            exe: app/build/windows/x64/runner/Release/passbundle.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      FLUTTER: ${{ matrix.flutter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        working-directory: core
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            core
            agent
      - name: Linux build tools and a virtual display
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libdbus-1-dev libssl-dev xvfb imagemagick
      - name: The agent's test build, for the app's unlock test
        working-directory: agent
        run: |
          rustup toolchain install
          cargo build --locked --features test-authenticator
      - name: Build the core
        working-directory: core
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            # The Mac app is universal (Apple silicon and Intel), so the core is too.
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --locked --release --features ffi --target aarch64-apple-darwin
            cargo build --locked --release --features ffi --target x86_64-apple-darwin
            mkdir -p target/release
            lipo -create -output target/release/libpassbundle_core.dylib \
              target/aarch64-apple-darwin/release/libpassbundle_core.dylib \
              target/x86_64-apple-darwin/release/libpassbundle_core.dylib
            lipo -info target/release/libpassbundle_core.dylib
          else
            cargo build --locked --release --features ffi
          fi
      - name: Install Flutter at the pinned release
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Turn off analytics
        run: |
          $FLUTTER config --no-analytics
          $FLUTTER --disable-analytics
      - name: Analyze
        if: matrix.platform == 'linux'
        run: |
          # The phone tests' fixtures, which aren't committed.
          tools/phone-test-fixtures.sh
          cd app && $FLUTTER analyze
      - name: Tests, against the real core
        working-directory: app
        run: |
          export PB_TEST_AGENT="$GITHUB_WORKSPACE/agent/target/debug/passbundle-agent$( [ "$RUNNER_OS" = Windows ] && echo .exe)"
          PB_CORE_LIB="$GITHUB_WORKSPACE/${{ matrix.lib }}" $FLUTTER test --exclude-tags screenshots
      - name: Build
        working-directory: app
        run: $FLUTTER build ${{ matrix.platform }} --release
      - name: The desktop agent's release build (Windows and macOS, where its tray is)
        if: matrix.platform != 'linux'
        working-directory: agent
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            # Universal, like the app and the core.
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            mkdir -p target/universal
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --locked --release --target "$target"
            done
            for program in passbundle-agent passbundle-agent-host; do
              lipo -create -output "target/universal/$program" \
                "target/aarch64-apple-darwin/release/$program" "target/x86_64-apple-darwin/release/$program"
            done
          else
            cargo build --locked --release
          fi
      - name: Put the core and the agent in the app
        run: |
          case "${{ matrix.platform }}" in
            linux)
              cp "${{ matrix.lib }}" "${{ matrix.bundle }}/lib/"
              test -f "${{ matrix.bundle }}/data/com.passbundle.app.png" ;;
            macos)
              # Named PassBundle, and not sandboxed: a sandboxed app can't
              # reach its server, the keychain, or the agent's socket.
              plist="${{ matrix.bundle }}/Contents/Info.plist"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.passbundle.app
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = PassBundle
              codesign --display --entitlements - --xml "${{ matrix.bundle }}" > entitlements.xml
              if grep -q app-sandbox entitlements.xml; then
                echo "The Mac app is sandboxed; it must not be (see app/macos/Runner/Release.entitlements)." >&2
                exit 1
              fi
              # The core in Frameworks, the agent as an app of its own in Helpers, signed ad hoc.
              tools/bundle-mac.sh "${{ matrix.bundle }}" "${{ matrix.lib }}" agent/target/universal
              # With the agent running, opening the app brings up the app: the
              # agent's own bundle keeps macOS from taking one for the other.
              helper="${{ matrix.bundle }}/Contents/Helpers/PassBundle Agent.app"
              "$helper/Contents/MacOS/passbundle-agent" &
              agent=$!
              sleep 3
              open "${{ matrix.bundle }}"
              for _ in $(seq 30); do pgrep -x passbundle > /dev/null && break; sleep 1; done
              pgrep -x passbundle > /dev/null || { echo "Opening the app didn't start it." >&2; exit 1; }
              pkill -x passbundle
              kill "$agent" ;;
            windows)
              cp "${{ matrix.lib }}" "${{ matrix.bundle }}/"
              cp agent/target/release/passbundle-agent.exe agent/target/release/passbundle-agent-host.exe "${{ matrix.bundle }}/" ;;
          esac
          ls "${{ matrix.bundle }}" | head -20
      - name: Measure (Linux)
        if: matrix.platform == 'linux'
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          export DISPLAY=:99
          sleep 2
          tools/measure.sh "${{ matrix.exe }}" "${{ matrix.bundle }}" screenshot-linux.png | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Measure (macOS)
        if: matrix.platform == 'macos'
        run: tools/measure.sh "${{ matrix.exe }}" "${{ matrix.bundle }}" screenshot-macos.png | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Measure (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: tools/measure.ps1 -Exe "${{ matrix.exe }}" -Bundle "${{ matrix.bundle }}" -Shot screenshot-windows.png | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
      - name: Pack the build
        run: tar -czf "passbundle-${{ matrix.platform }}.tar.gz" -C "$(dirname "${{ matrix.bundle }}")" "$(basename "${{ matrix.bundle }}")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passbundle-${{ matrix.platform }}
          path: |
            passbundle-${{ matrix.platform }}.tar.gz
            screenshot-${{ matrix.platform }}.png
          if-no-files-found: warn
          retention-days: 7
