[package]
name = "passbundle-core"
version = "0.1.0"
description = "PassBundle's core: the vault format, keys, and everything the apps do but drawing"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "passbundle_core"
# rlib for Rust and tests; cdylib for the app (dart:ffi in the prototype).
crate-type = ["rlib", "cdylib"]

[features]
# The app's C bridge (src/ffi.rs).
ffi = []
# Trusting a given certificate instead of the OS's, for tests against a
# throwaway HTTPS server (examples/interop.rs). Never in the app.
test-trust = []
# Settings for test runs from the environment: PB_DATA_DIR (the app's
# folder) and PB_SECRETS=memory (the session in memory, never the OS's
# store), for CI's builds that tools/measure.sh, tools/measure.ps1, and
# tools/mac-update-test.sh --launch open. Never in a release
# (.github/workflows/macos-release.yml checks): a release reads neither.
test-hooks = []

# Signs in, prints what it reads, and saves an item: the e2e suite checks the
# web vault and the core read each other's items.
[[example]]
name = "interop"
required-features = ["test-trust"]

# Finishes a Windows or Linux update once the app has quit: puts the new
# version in the old one's place, opens it, and puts the old one back if it
# doesn't start (src/updates/swap.rs).
[[bin]]
name = "passbundle-update"
path = "src/bin/passbundle-update.rs"

# RustCrypto, as the desktop agent uses. Never a Bitwarden crate (docs/core.md).
[dependencies]
# The desktop agent's socket, shared with the agent (../ipc).
passbundle-ipc = { path = "../ipc" }
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
dirs = "6"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Passkeys: ES256 keys, signed with RFC 6979's nonces (src/passkey.rs).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
# The Public Suffix List, for which logins fill on a website (src/matching.rs).
psl = "2"
rand = "0.8"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
# How strong a password is, by the same measure as the web vault's Health
# reports and the extension (Dropbox's zxcvbn, ported; src/health.rs).
zxcvbn = "3"

# The clipboard on computers; phones copy through the app (docs/phones.md, "Copying").
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false }
# Windows and Linux test releases (src/updates): each release's manifest is
# signed with Ed25519, and names a zip (Windows) or a tarball (Linux).
ed25519-dalek = "2"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# The OS's secret store: Keychain, Credential Manager, Secret Service. Android
# keeps the refresh token with the Keystore instead (docs/phones.md).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# The Android app's native calls (src/android.rs), and Android's own
# certificate checks, which need the app's context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

# SHA-256 in the chip's own instructions on ARM (Apple silicon, phones): PBKDF2
# takes a sixth of the time (46 ms instead of 288 on an M1 Pro). x86 uses its
# SHA extensions without this; the assembly doesn't build with MSVC.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

# What the OS says about the computer being used, its screen locked, and time
# asleep, for locking by itself (src/autolock.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

# The server an MDM profile sets (src/managed.rs), as the agent reads it.
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde_json = "1"

# A stand-in for GitHub's releases, for the updater's tests (src/updates).
[dev-dependencies]
tiny_http = "0.12"

# The KDFs at full strength in tests, so they take milliseconds, not minutes.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
