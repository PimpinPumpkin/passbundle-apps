[package]
name = "passbundle-core"
version = "0.1.0"
description = "PassBundle's core: the vault format, keys, and everything the apps do but drawing"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "passbundle_core"
# rlib for Rust and tests; cdylib for the app (dart:ffi in the prototype).
crate-type = ["rlib", "cdylib"]

[features]
# The prototype's C bridge (src/ffi.rs). The real app uses flutter_rust_bridge.
ffi = []

# RustCrypto, as the desktop agent uses. Never a Bitwarden crate (docs/core.md).
[dependencies]
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

# SHA-256 in the chip's own instructions on ARM (Apple silicon, phones): PBKDF2
# takes a sixth of the time (46 ms instead of 288 on an M1 Pro). x86 uses its
# SHA extensions without this; the assembly doesn't build with MSVC.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

# The KDFs at full strength in tests, so they take milliseconds, not minutes.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
