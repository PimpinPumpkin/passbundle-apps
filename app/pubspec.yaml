name: passbundle
description: "PassBundle: the password manager, on every platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  ffi: 2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The app's tests on a phone or emulator (integration_test/, tools/android-app-test.sh).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Google Sans Flex 5.000 (SIL Open Font License,
    # assets/fonts/GoogleSansFlex-OFL.txt), bundled so every platform draws the
    # same letters: one variable file, with the weight axis.
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-wght.ttf
